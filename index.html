<style>

  .signout-btn:hover { color: #fff; background: var(--ink-soft); }

  .topbar h1 { font-size: 19px; }
  .topbar .subtitle { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
  .content { padding: 22px 28px 40px; max-width: 1120px; width: 100%; margin: 0 auto; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .card + .card { margin-top: 16px; }
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; border-top: 3px solid var(--accent); }
  .stat-card:nth-child(2) { border-top-color: var(--info); }
  .stat-card:nth-child(3) { border-top-color: var(--warn); }
  .stat-card:nth-child(4) { border-top-color: #6B46C1; }
  .stat-num { font-family: var(--font-display); font-size: 26px; font-weight: 700; }
  .stat-label { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .field label { font-size: 12.5px; font-weight: 600; color: var(--text-dim); }
  input[type=text], input[type=password], input[type=date], input[type=month], input[type=search], input[type=url], input:not([type]), select, textarea {
    padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--text); width: 100%;

  textarea { min-height: 64px; resize: vertical; font-family: var(--font-body); }

  button.secondary:hover { background: var(--paper); }
  button.danger { background: var(--danger); color: #fff; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .dot-submitted { background: var(--info); }
  .dot-approved { background: var(--accent); }
  .dot-low { background: var(--low); }
  .dot-medium { background: var(--info); }
  .dot-high { background: var(--warn); }
  .dot-urgent { background: var(--danger); }

  .login-sub { color: var(--text-dim); font-size: 13.5px; margin-bottom: 22px; }

  .kanban { display: grid; gap: 14px; align-items: start; }

  .kanban-col { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; min-height: 200px; }

  @media (max-width: 720px) {
    .shell { flex-direction: column; }
    .sidebar { width: 100%; flex-direction: row; align-items: center; padding: 10px 14px; }
    .brand { padding: 0 8px 0 0; }
    .nav-group { flex-direction: row; margin-bottom: 0; overflow-x: auto; }

    .user-card { border-top: none; padding-top: 0; }
    .content { padding: 16px 14px 32px; }
    .topbar { padding: 12px 16px; }

  }
</style>

function subscribe() {
  let prevTaskMap = new Map(S.tasks.map(t => [t.id, { status: t.status, stage: t.stage || null, assignedToId: t.assignedToId }]));
  function checkTaskDiffs(newTasks) {
    newTasks.forEach(t => {
      const prev = prevTaskMap.get(t.id);
      if (!prev) notifyIfRelevant(t, 'created');
      else if (prev.status !== t.status || prev.stage !== (t.stage || null)) notifyIfRelevant(t, 'changed');
      else if (prev.assignedToId !== t.assignedToId) notifyIfRelevant(t, 'reassigned');
    });
    prevTaskMap = new Map(newTasks.map(t => [t.id, { status: t.status, stage: t.stage || null, assignedToId: t.assignedToId }]));
  }

  sb.channel('people-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'people' }, async () => {
    await fetchPeople(); render();
  }).subscribe((status, err) => {
    if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') { S.error = 'Live updates (people) could not connect: ' + (err ? err.message : status); render(); }
  });
  sb.channel('tasks-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, async () => {
    await fetchTasks();
    checkTaskDiffs(S.tasks);
    render();
  }).subscribe((status, err) => {
    if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') { S.error = 'Live updates (tasks) could not connect: ' + (err ? err.message : status); render(); }
  });

  // Safety net: even if the live connection above has trouble, this keeps checking every
  // 20 seconds so notifications and fresh data still arrive either way.
  setInterval(async () => {
    if (!S.role) return;
    await fetchTasks();
    checkTaskDiffs(S.tasks);
    render();
  }, 20000);
}

function addDays(dateStr, days) { const d = new Date(dateStr + 'T00:00:00'); d.setDate(d.getDate() + days); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

async function createTask(form) {
  const { title, notes, assignedToId, recurrence, startDate, priority, category, checklist } = form;
  const assignedToName = (S.people.find(e => e.id === assignedToId) || {}).name || 'Unknown';
  const seriesId = recurrence === 'once' ? null : uid();
  const occurrences = [];
  if (recurrence === 'once') occurrences.push(startDate);
  else if (recurrence === 'daily') for (let i = 0; i < 14; i++) occurrences.push(addDays(startDate, i));
  else if (recurrence === 'weekly') for (let i = 0; i < 10; i++) occurrences.push(addDays(startDate, i * 7));
  else if (recurrence === 'monthly') for (let i = 0; i < 6; i++) occurrences.push(addMonths(startDate, i));
  const initialChecklist = (checklist || []).map(text => ({ id: uid(), text, done: false }));
  const rows = occurrences.map(due => ({
    title, notes: notes || '', assigned_to: assignedToId, assigned_to_name: assignedToName,
    due_date: due, recurrence_type: recurrence, series_id: seriesId,
    status: 'pending', stage: null, priority: priority || 'medium', category: category || 'general',
    review_note: null, checklist: initialChecklist, comments: [], attachments: [],
    activity: [{ id: uid(), at: nowIso(), actor: myName(), action: 'Created and assigned to ' + assignedToName }],
  }));
  const { error } = await sb.from('tasks').insert(rows);
  if (error) { S.error = 'Could not create task: ' + error.message; render(); }
}

  else if (S.quickAddDate) app.appendChild(renderQuickAddModal(S.quickAddDate));
  if (S.toasts.length) app.appendChild(renderToastStack());
}

function renderToastStack() {
  const stack = el(`<div class="toast-stack"></div>`);
  S.toasts.forEach(ts => {
    const card = el(`<div class="toast"></div>`);
    card.appendChild(el(`<div class="toast-dot"></div>`));
    card.appendChild(el(`<div class="toast-body"><div class="toast-title">${ts.title}</div><div class="toast-text">${ts.body}</div></div>`));
    const closeBtn = el(`<button class="toast-close">×</button>`);
    closeBtn.onclick = () => dismissToast(ts.id);
    card.appendChild(closeBtn);
    stack.appendChild(card);
  });
  return stack;
}

function renderLogin() {
  const screen = el(`<div class="login-screen"></div>`);
  const panel = el(`<div class="login-panel"></div>`);
  panel.appendChild(el(`<div class="login-brand"><span class="brand-mark" style="color:var(--accent)">${ICONS.mark}</span><span>Office Workflow</span></div>`));
  panel.appendChild(el(`<div class="login-sub">Sign in to your firm's workspace</div>`));

  const email = el(`<input type="text" placeholder="Email" autocapitalize="off" autocomplete="username" />`);
  const pass = el(`<input type="password" placeholder="Password" autocomplete="current-password" />`);
  const btn = el(`<button style="width:100%">Sign in</button>`);
  btn.onclick = async () => {
    btn.disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({ email: email.value.trim(), password: pass.value });
    btn.disabled = false;
    if (error) { S.error = 'Incorrect email or password'; render(); return; }
    await onSignedIn(data.session);

  pass.onkeydown = (e) => { if (e.key === 'Enter') btn.onclick(); };

  panel.appendChild(el(`<div class="login-hint">Forgot your password? Ask your Admin to reset it from the Supabase dashboard.</div>`));

  return screen;

function navItem(key, label, active, onClick) { const it = el(`<div class="nav-item${active?' active':''}">${ICONS[key]}<span>${label}</span></div>`); it.onclick = onClick; return it; }

function getNotifications() {
  const items = [];
  if (S.role === 'admin') {
    S.tasks.filter(t => t.status === 'submitted').forEach(t => items.push({ at: t.submittedAt || t.createdAt, text: `${t.assignedToName} submitted "${t.title}"`, tab: 'review' }));
  } else if (S.role === 'employee') {
    S.tasks.filter(t => t.assignedToId === S.currentPerson.id && t.reviewNote && t.status === 'pending').forEach(t => items.push({ at: t.activity && t.activity.length ? t.activity[t.activity.length-1].at : t.createdAt, text: `"${t.title}" was sent back: ${t.reviewNote}`, tab: 'mylist', taskId: t.id }));
  }
  items.sort((a,b) => (b.at||'').localeCompare(a.at||''));
  return items;
}

function navItemsForRole() {
  if (S.role === 'admin') return [['overview','Overview'],['assign','Assign task'],['listview','All tasks'],['pipeline','Pipeline'],['workload','Workload'],['attendance','Attendance'],['review','Review queue'],['team','Team'],['reports','Reports'],['deletedlog','Deleted tasks'],['companies','Companies House']];

}

    review: ['Review queue','Work submitted by your team, at every stage'], team: ['Team','Everyone with access to this workspace'],
    reports: ['Reports','Export a month of activity'], mylist: ['My tasks','Everything assigned to you'],
    listview: ['All tasks','Search, filter, and act on tasks in bulk'], board: ['Board','Drag a task to change its status'],
    pipeline: ['Pipeline','Every task and exactly where it sits right now'],
    deletedlog: ['Deleted tasks','A permanent record of everything removed'],
    everyonetasks: ['Everyone tasks','See what stands where, firm-wide — view only'],

  else if (S.tab === 'assign' && S.role === 'admin') content.appendChild(renderAssign());
  else if (S.tab === 'review' && S.role === 'admin') content.appendChild(renderOwnerReviewQueue());
  else if (S.tab === 'team' && S.role === 'admin') content.appendChild(renderTeam());

  else if (S.tab === 'mylist' && S.role === 'employee') content.appendChild(renderListView(false));
  else if (S.tab === 'board' && S.role === 'employee') content.appendChild(renderEmployeeBoard());
  else if (S.tab === 'pipeline') content.appendChild(renderPipeline());
  else if (S.tab === 'everyonetasks' && S.role === 'employee') content.appendChild(renderListView(true));

  main.appendChild(content);
  shell.appendChild(main);
  return shell;
}

function renderOverview() {
  const frag = document.createDocumentFragment();
  const tasks = nonPayrollTasks(visibleTasks());
  const today = todayStr();
  const stats = S.role === 'admin'
    ? [ ['Open tasks', tasks.filter(t=>t.status==='pending').length], ['In the approval chain', tasks.filter(t=>t.status==='submitted').length],
        ['Overdue', tasks.filter(t=>t.status==='pending' && t.dueDate < today).length], ['Team members', employees().length] ]
    : [ ['My open tasks', tasks.filter(t=>t.status==='pending').length], ['Due this week', tasks.filter(t=>t.status==='pending' && t.dueDate >= today && t.dueDate <= addDays(today,7)).length],
        ['In review', tasks.filter(t=>t.status==='submitted').length], ['Approved this month', tasks.filter(t=>t.status==='approved' && t.dueDate.slice(0,7)===today.slice(0,7)).length] ];
  const statRow = el(`<div class="stat-row"></div>`);
  stats.forEach(([label, num]) => statRow.appendChild(el(`<div class="stat-card"><div class="stat-num">${num}</div><div class="stat-label">${label}</div></div>`)));
  frag.appendChild(statRow);
  frag.appendChild(renderCheckInCard());
  frag.appendChild(renderCalendarCard());
  return frag;
}

function renderCheckInCard() {
  const card = el(`<div class="card"></div>`);
  const open = myOpenAttendanceToday();
  const todaysRecord = myAttendanceRecordToday();
  const head = el(`<div class="row" style="justify-content:space-between"></div>`);
  head.appendChild(el(`<h3 style="font-size:15px">Attendance</h3>`));

    const btn = el(`<button class="secondary">Check out</button>`);
    btn.onclick = () => checkOutNow();
    head.appendChild(btn);

    const btn = el(`<button>Check in</button>`);
    btn.onclick = () => checkInNow();
    head.appendChild(btn);
  }
  card.appendChild(head);
  card.appendChild(el(`<div class="muted mono" style="margin-top:2px;font-size:12px">${fmtFullDate(todayStr())}</div>`));
  if (open) card.appendChild(el(`<div class="muted" style="margin-top:6px">Checked in at ${fmtDateTime(open.checkInAt)} — still open</div>`));

function renderAttendanceLog() {
  const frag = document.createDocumentFragment();
  const filterCard = el(`<div class="card" style="margin-bottom:16px"></div>`);
  const dateInput = el(`<input type="date" value="${todayStr()}" style="width:auto" />`);
  const f = el(`<div class="field"><label>Date</label></div>`); f.appendChild(dateInput); filterCard.appendChild(f);
  frag.appendChild(filterCard);
  const card = el(`<div class="card"></div>`);
  frag.appendChild(card);
  function renderRows() {
    card.innerHTML = '';
    card.appendChild(el(`<h3 style="font-size:15px;margin-bottom:10px">${fmtFullDate(dateInput.value)}</h3>`));
    const rows = S.attendance.filter(a => a.workDate === dateInput.value).sort((a,b)=>a.personName.localeCompare(b.personName));
    if (!rows.length) { card.appendChild(el(`<div class="empty-state"><h3>No check-ins that day</h3></div>`)); return; }
    const table = el(`<table><thead><tr><th>Name</th><th>Checked in</th><th>Checked out</th></tr></thead><tbody></tbody></table>`);
    const tbody = table.querySelector('tbody');
    rows.forEach(a => {
      tbody.appendChild(el(`<tr><td>${a.personName}</td><td class="mono">${fmtDateTime(a.checkInAt)}</td><td class="mono">${a.checkOutAt ? fmtDateTime(a.checkOutAt) : '—'}</td></tr>`));
    });
    card.appendChild(table);
  }
  dateInput.onchange = renderRows;
  renderRows();
  return frag;
}

function renderCalendarCard() {
  const card = el(`<div class="card"></div>`);
  const {y, m} = S.calMonth;
  const nav = el(`<div class="row" style="justify-content:space-between; margin-bottom:14px"></div>`);
  const prev = el(`<button class="secondary">Previous</button>`);
  const next = el(`<button class="secondary">Next</button>`);
  prev.onclick = () => { S.calMonth.m--; if (S.calMonth.m<0){S.calMonth.m=11;S.calMonth.y--;} render(); };
  next.onclick = () => { S.calMonth.m++; if (S.calMonth.m>11){S.calMonth.m=0;S.calMonth.y++;} render(); };
  nav.appendChild(prev);
  nav.appendChild(el(`<h3 style="font-size:15px">${new Date(y,m,1).toLocaleString('default',{month:'long'})} ${y}</h3>`));
  nav.appendChild(next);
  card.appendChild(nav);
  if (S.role === 'admin') card.appendChild(el(`<div class="muted" style="margin-bottom:10px">Click any date to assign a task for that day.</div>`));
  const grid = el(`<div class="cal-grid"></div>`);
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d => grid.appendChild(el(`<div class="cal-dow">${d}</div>`)));
  const first = new Date(y, m, 1);
  let startOffset = first.getDay() - 1; if (startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const tasks = nonPayrollTasks(visibleTasks());
  const today = todayStr();
  for (let i=0; i<startOffset; i++) grid.appendChild(el(`<div></div>`));
  for (let day=1; day<=daysInMonth; day++) {
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const cell = el(`<div class="cal-cell${S.role==='admin'?' clickable':''}"><div class="cal-daynum${dateStr===today?' today':''}">${day}</div></div>`);
    if (S.role === 'admin') cell.onclick = () => { S.quickAddDate = dateStr; render(); };
    tasks.filter(t => t.dueDate === dateStr).forEach(t => {
      const label = S.role === 'admin' ? `${t.assignedToName}: ${t.title}` : t.title;
      const chip = el(`<div class="cal-chip" title="${label}">${label}</div>`);
      chip.onclick = (e) => { e.stopPropagation(); S.detailTaskId = t.id; render(); };
      cell.appendChild(chip);
    });
    grid.appendChild(cell);
  }
  card.appendChild(grid);
  return card;
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const diff = Math.round((new Date(dateStr + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 86400000);
  return diff;
}
function deadlineBadge(dateStr) {
  if (!dateStr) return `<span class="muted">Not checked yet</span>`;
  const d = daysUntil(dateStr);
  let color = 'var(--accent)';
  if (d < 0) color = 'var(--danger)'; else if (d <= 30) color = 'var(--warn)';
  return `<span style="color:${color};font-weight:600">${fmtDate(dateStr)}</span> <span class="muted">(${d < 0 ? Math.abs(d) + ' days overdue' : d + ' days left'})</span>`;
}

function matchesFilters(t) {
  const f = S.filters;
  if (!f.category && categoryOf(t) === 'payroll') return false; // Payroll only ever shows on its own page
  if (f.search && !(t.title.toLowerCase().includes(f.search.toLowerCase()) || (t.notes||'').toLowerCase().includes(f.search.toLowerCase()))) return false;
  if (f.employee && t.assignedToId !== f.employee) return false;
  if (f.status && t.status !== f.status) return false;
  if (f.priority && (t.priority||'medium') !== f.priority) return false;
  if (f.category && categoryOf(t) !== f.category) return false;
  return true;
}

function renderEmployeeBoard() {

  const kanban = el(`<div class="kanban cols-3"></div>`);
  const tasks = nonPayrollTasks(visibleTasks());
  cols.forEach(([status,label]) => {
    const colTasks = tasks.filter(t => t.status === status).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
    const col = el(`<div class="kanban-col"></div>`);
    col.appendChild(el(`<div class="kanban-col-head"><span>${label}</span><span class="muted">${colTasks.length}</span></div>`));
    colTasks.forEach(t => {
      const card = el(`<div class="kanban-card" draggable="${status==='pending'}"><div class="kt">${t.title}</div><div class="task-meta"><span class="mono">Started ${fmtAssignedDate(t.createdAt)}</span><span class="mono">Due ${fmtDate(t.dueDate)}</span>${priorityPill(t.priority)}</div></div>`);
      if (status === 'pending') card.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', t.id); });
      card.onclick = () => { S.detailTaskId = t.id; render(); };
      col.appendChild(card);
    });
    col.addEventListener('dragover', (e) => { if (status === 'submitted') { e.preventDefault(); col.classList.add('dragover'); } });
    col.addEventListener('dragleave', () => col.classList.remove('dragover'));
    col.addEventListener('drop', async (e) => {
      e.preventDefault(); col.classList.remove('dragover');
      if (status !== 'submitted') return;
      const taskId = e.dataTransfer.getData('text/plain');
      const t = taskById(taskId);
      if (t && t.status === 'pending') await submitTask(taskId);
    });
    kanban.appendChild(col);
  });
  wrap.appendChild(kanban);
  wrap.appendChild(el(`<div class="muted" style="margin-top:12px">Drag a pending task into "In review" to mark it complete.</div>`));
  return wrap;
}

  overlay.onclick = (e) => { if (e.target === overlay) { S.detailTaskId = null; render(); } };
  const modal = el(`<div class="modal"></div>`);
  const head = el(`<div class="modal-head"><div><h3 style="font-size:17px">${t.title}</h3><div class="task-meta" style="margin-top:6px"><span>${t.assignedToName}</span><span class="mono">Started ${fmtAssignedDate(t.createdAt)}</span><span class="mono">Due ${fmtDate(t.dueDate)}</span>${statusPill(t)}${priorityPill(t.priority)}${categoryPill(t)}</div></div></div>`);
  const closeBtn = el(`<button class="modal-close">×</button>`);
  closeBtn.onclick = () => { S.detailTaskId = null; render(); };
  head.appendChild(closeBtn);
  modal.appendChild(head);
  if (t.notes) modal.appendChild(el(`<div class="muted" style="margin-top:12px">${t.notes}</div>`));
  if (t.reviewNote) modal.appendChild(el(`<div class="task-note" style="margin-top:10px">Sent back: ${t.reviewNote}</div>`));

  const actions = el(`<div class="row" style="margin-top:16px"></div>`);
  if ((S.role === 'employee' || S.role === 'admin') && t.status === 'pending') {
    const b = el(`<button>Mark complete</button>`); b.onclick = () => submitTask(t.id); actions.appendChild(b);
  }
  if (S.role === 'admin' && t.status === 'submitted') { actions.appendChild(reviewRowActions(t)); }
  if (S.role === 'employee' && t.assignedToId === S.currentPerson.id && t.status === 'pending') {
    const others = employees().filter(e => e.id !== t.assignedToId);
    if (others.length) {
      actions.appendChild(el(`<span class="muted">Move to:</span>`));
      const moveSel = el(`<select style="width:auto"><option value="">Choose someone…</option></select>`);
      others.forEach(e => moveSel.appendChild(el(`<option value="${e.id}">${e.name}</option>`)));
      moveSel.onchange = () => { if (moveSel.value) reassignTask(t.id, moveSel.value); };
      actions.appendChild(moveSel);
    }
  }
  if (S.role === 'admin') {
    const prioSel = el(`<select style="width:auto"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="urgent">Urgent</option></select>`);
    prioSel.value = t.priority || 'medium';
    prioSel.onchange = () => setPriority(t.id, prioSel.value);
    actions.appendChild(prioSel);
    const catSel = el(`<select style="width:auto">${categorySelectHtml(categoryOf(t))}</select>`);
    catSel.onchange = () => setCategory(t.id, catSel.value);
    actions.appendChild(catSel);
    actions.appendChild(el(`<span class="muted">Reassign:</span>`));
    const reassignSel = el(`<select style="width:auto"></select>`);
    employees().forEach(e => reassignSel.appendChild(el(`<option value="${e.id}" ${e.id===t.assignedToId?'selected':''}>${e.name}</option>`)));
    reassignSel.onchange = () => { if (reassignSel.value !== t.assignedToId) reassignTask(t.id, reassignSel.value); };
    actions.appendChild(reassignSel);
    if (t.status !== 'pending') { const reopen = el(`<button class="secondary">Reopen</button>`); reopen.onclick = () => reopenTask(t.id); actions.appendChild(reopen); }
    const del = el(`<button class="danger">Delete</button>`); del.onclick = () => { if (confirm('Delete this task?')) { deleteTaskById(t.id); S.detailTaskId = null; render(); } }; actions.appendChild(del);
  }
  if (actions.children.length) modal.appendChild(actions);

  const clSection = el(`<div class="modal-section"><h4>Checklist</h4></div>`);
  (t.checklist||[]).forEach(item => {
    const row = el(`<div class="checklist-item"></div>`);
    const cb = el(`<input type="checkbox" ${item.done?'checked':''} />`);
    cb.onclick = () => toggleChecklistItem(t.id, item.id);
    row.appendChild(cb);
    row.appendChild(el(`<span class="${item.done?'done':''}">${item.text}</span>`));
    clSection.appendChild(row);
  });
  clSection.appendChild(renderSubtaskPicker(categoryOf(t), (name) => addChecklistItem(t.id, name)));
  const clInput = el(`<input type="text" placeholder="Or type your own and press Enter" />`);
  clInput.onkeydown = (e) => { if (e.key === 'Enter' && clInput.value.trim()) { addChecklistItem(t.id, clInput.value); clInput.value=''; } };
  clSection.appendChild(clInput);
  modal.appendChild(clSection);

  const atSection = el(`<div class="modal-section"><h4>Links & attachments</h4></div>`);
  (t.attachments||[]).forEach(a => atSection.appendChild(el(`<div class="attachment-row">🔗 <a href="${a.url}" target="_blank" rel="noopener">${a.label}</a></div>`)));
  const atLabel = el(`<input type="text" placeholder="Label (e.g. Client file)" style="margin-bottom:6px" />`);
  const atUrl = el(`<input type="url" placeholder="https://…" />`);
  const atBtn = el(`<button class="secondary" style="margin-top:6px">Add link</button>`);
  atBtn.onclick = () => { if (atUrl.value.trim()) { addAttachment(t.id, atLabel.value, atUrl.value); atLabel.value=''; atUrl.value=''; } };
  atSection.appendChild(atLabel); atSection.appendChild(atUrl); atSection.appendChild(atBtn);
  modal.appendChild(atSection);

  const cSection = el(`<div class="modal-section"><h4>Comments</h4></div>`);
  (t.comments||[]).forEach(c => cSection.appendChild(el(`<div class="comment"><div class="comment-head">${c.author}<span class="comment-time">${fmtDateTime(c.at)}</span></div><div>${c.text}</div></div>`)));
  const cInput = el(`<textarea placeholder="Add a comment…" style="margin-top:8px"></textarea>`);
  const cBtn = el(`<button style="margin-top:6px">Post comment</button>`);
  cBtn.onclick = () => { if (cInput.value.trim()) { addComment(t.id, cInput.value); cInput.value=''; } };
  cSection.appendChild(cInput); cSection.appendChild(cBtn);
  modal.appendChild(cSection);

  const aSection = el(`<div class="modal-section"><h4>Activity</h4></div>`);
  (t.activity||[]).slice().reverse().forEach(a => aSection.appendChild(el(`<div class="activity-item"><div class="a-dot"></div><div>${a.actor} — ${a.action}<div class="mono" style="font-size:11px">${fmtDateTime(a.at)}</div></div></div>`)));
  modal.appendChild(aSection);

  overlay.appendChild(modal);
  return overlay;
}

async function onSignedIn(session) {
  if (!session) return;
  await fetchPeople();
  const me = S.people.find(p => p.id === session.user.id);
  if (!me) {
    S.error = "Your login worked, but there's no profile for you yet — refresh in a moment, or ask your Admin to check the Team page.";
    render();
    return;
  }
  S.role = me.role;
  S.currentPerson = { id: me.id, name: me.name };
  S.error = null;
  requestNotifyPermission();
  await fetchTasks();
  await fetchDeletedLogs();
  await fetchCompanies();
  await fetchAttendance();
  subscribe();
  render();
}

function showFatalError(msg) {
  document.getElementById('app').innerHTML = `<div class="login-screen"><div class="login-panel"><strong>Something went wrong loading the app:</strong><div class="mono" style="margin-top:10px;font-size:12px;white-space:pre-wrap">${msg}</div><div class="muted" style="margin-top:14px">Screenshot this and send it over — it tells us exactly what to fix.</div></div></div>`;
}
window.addEventListener('error', (e) => { try { showFatalError(e.message + (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : '')); } catch(_) {} });
window.addEventListener('unhandledrejection', (e) => { try { showFatalError(String(e.reason && e.reason.message || e.reason)); } catch(_) {} });

async function boot() {
  try {
    if (!window.supabase) { showFatalError('The Supabase library did not load from the CDN. Check your internet connection and reload.'); return; }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    dbReady = true;
    render();
    const { data: { session } } = await sb.auth.getSession();
    if (session) await onSignedIn(session);
    else render();

    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') { S.role = null; S.currentPerson = null; S.people = []; S.tasks = []; render(); }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  } catch (e) {
    showFatalError(e.message);
  }
}
boot();
})();
</script>
</body>
</html>
